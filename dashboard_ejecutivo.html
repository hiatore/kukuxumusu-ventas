.mast .actions button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 0;border-bottom:1px solid transparent;font-family:inherit}

/* ===== KPI STRIP ===== */

p.sec-sub{font-size:12px;color:var(--muted);margin-bottom:14px}

.rank-list{border-top:1px solid var(--line)}
.rank-row{display:grid;grid-template-columns:22px 150px 1fr 190px;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rank-row:hover{background:var(--paper-alt)}
.rank-row .n{color:var(--muted);font-size:12px;text-align:right}
.rank-row .name{font-weight:600;font-size:13.5px}

/* ===== TABLES ===== */
.table-panel{border:1px solid var(--line);padding:16px 18px 4px;margin-bottom:6px}
.table-tools{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

.table-tools input:focus{outline:none;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{padding:6px 6px;color:var(--muted);font-weight:600;font-size:10.5px;border-bottom:1px solid var(--ink);white-space:nowrap;text-align:left}
td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
tbody tr:hover td{background:var(--paper-alt)}

.tbl-scroll{overflow-x:auto;max-height:460px;overflow-y:auto}

function storeRankHTML(list, maxI){
var h='<div class="rank-list">';
for(var i=0;i<list.length;i++){var s=list[i];var w=(s.I/maxI*100).toFixed(1);
h+='<div class="rank-row" onclick="openModal(\''+esc(s.Tienda)+'\')">'+
 '<div class="n">'+(i+1)+'</div>'+
 '<div class="name">'+s.Tienda+'</div>'+
 '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+s.color+'"></div></div>'+
 '<div class="nums"><b>'+eur(s.I)+'</b>'+fmt(s.U)+' u · '+fmt(s.T)+' tickets</div>'+
 '</div>';
}
return h+'</div>';
}

var pM='U',pF=null;
function renderP(){var d=pF||(pM==='U'?D.top_u:D.top_i);var s=d.slice();if(pM==='U')s.sort(function(a,b){return b.U-a.U});else s.sort(function(a,b){return b.I-a.I});

document.getElementById('pb').innerHTML=h;}
function rp(m,btn){pM=m;var b=btn.parentNode.querySelectorAll('button');for(var i=0;i<b.length;i++)b[i].classList.remove('act');btn.classList.add('act');renderP();}
function fp(v){var q=v.toLowerCase().trim();if(!q){pF=null;}else{pF=[];var src=pM==='U'?D.top_u:D.top_i;for(var i=0;i<src.length;i++){var p=src[i];if(p.Nombre.toLowerCase().includes(q)||(p['Código']||'').toLowerCase().includes(q))pF.push(p);}}renderP();}

// PARETO GLOBAL
var gF=null;
function renderG(){if(!D.global_rank)return;var d=gF||D.global_rank;var h='';for(var i=0;i<Math.min(100,d.length);i++){var p=d[i];h+='<tr><td class="rk">'+(i+1)+'</td><td>'+p.n+'</td><td class="num">'+eur(p.t)+'</td><td class="num">'+p.p+'%</td><td class="num">'+p.c+'%</td></tr>';}var el=document.getElementById('gb');if(el)el.innerHTML=h;}
